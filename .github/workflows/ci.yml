name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.1'
  GOLANGCI_LINT_VERSION: v2.14.0
  NFPM_VERSION: v2.47.0

jobs:
  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just
      - run: just fmt-check

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install just and golangci-lint
        run: |
          sudo apt-get update
          sudo apt-get install -y curl just
          version="${GOLANGCI_LINT_VERSION#v}"
          archive="golangci-lint-${version}-linux-amd64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 "/tmp/golangci-lint-${version}-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint
          golangci-lint --version
      - run: just lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just
      - run: just test

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just
      - run: just build

  artifact-gate:
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            base_sha=$PR_BASE_SHA
            head_sha=$PR_HEAD_SHA
          else
            base_sha=$PUSH_BASE_SHA
            head_sha=$GITHUB_SHA
          fi
          if git diff --quiet "$base_sha" "$head_sha" -- nfpm.yaml README.md LICENSE packaging .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  linux-artifacts:
    if: needs.artifact-gate.outputs.run == 'true'
    needs: artifact-gate
    name: linux artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            goarch: amd64
            package_arch: amd64
            nfpm_arch: x86_64
            file_machine: x86-64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            goarch: arm64
            package_arch: arm64
            nfpm_arch: arm64
            file_machine: aarch64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl file
      - name: Build Linux archive
        env:
          GOARCH: ${{ matrix.goarch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary_dir="dist/bin-${TARGET}"
          archive_dir="archive/websudo-${TARGET}"
          mkdir -p "$binary_dir" "$archive_dir/packaging/systemd"
          for name in websudo websudo-askpass websudo-approverd; do
            GOOS=linux GOARCH="$GOARCH" go build -trimpath -o "$binary_dir/$name" "./cmd/$name"
            cp "$binary_dir/$name" "$archive_dir/$name"
          done
          cp README.md "$archive_dir/README.md"
          cp LICENSE "$archive_dir/LICENSE"
          cp packaging/websudo.env.example "$archive_dir/packaging/websudo.env.example"
          cp packaging/systemd/*.service "$archive_dir/packaging/systemd/"
          tar -czf "dist/websudo-${TARGET}.tar.gz" -C archive "websudo-${TARGET}"
      - name: Verify Linux binaries
        env:
          TARGET: ${{ matrix.target }}
          FILE_MACHINE: ${{ matrix.file_machine }}
        run: |
          set -euo pipefail
          for binary in dist/bin-${TARGET}/websudo dist/bin-${TARGET}/websudo-askpass dist/bin-${TARGET}/websudo-approverd; do
            test -x "$binary"
            file "$binary" | grep -i "$FILE_MACHINE"
          done
      - name: Install nFPM
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
        run: |
          set -euo pipefail
          nfpm_version="${NFPM_VERSION#v}"
          archive="nfpm_${nfpm_version}_Linux_${NFPM_ARCH}.tar.gz"
          curl -sSfL -o "/tmp/${archive}" "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version
      - name: Set package metadata
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            package_version="${GITHUB_REF_NAME#v}"
            package_release="1"
          else
            package_version="0.0.0"
            package_release="${GITHUB_RUN_NUMBER}"
          fi
          {
            echo "PACKAGE_VERSION=${package_version}"
            echo "PACKAGE_RELEASE=${package_release}"
          } >> "$GITHUB_ENV"
      - name: Build Linux packages
        env:
          PACKAGE_ARCH: ${{ matrix.package_arch }}
          PACKAGE_BINARY_DIR: dist/bin-${{ matrix.target }}
        run: |
          nfpm package --config nfpm.yaml --packager deb --target dist/
          nfpm package --config nfpm.yaml --packager rpm --target dist/
      - name: Verify deb package in Debian
        run: packaging/scripts/verify-package-in-container.sh debian '${{ matrix.file_machine }}'
      - name: Verify rpm package in Fedora
        run: packaging/scripts/verify-package-in-container.sh fedora '${{ matrix.file_machine }}'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-${{ matrix.target }}-artifacts
          path: |
            dist/websudo-${{ matrix.target }}.tar.gz
            dist/*.deb
            dist/*.rpm

  aur-rehearsal:
    if: needs.artifact-gate.outputs.run == 'true'
    needs: [artifact-gate, linux-artifacts]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: linux-*-artifacts
          path: dist
          merge-multiple: true
      - name: Render AUR PKGBUILD
        run: |
          mkdir -p dist/aur
          packaging/scripts/render-aur-pkgbuild.sh \
            0.0.0 \
            "$(sha256sum dist/websudo-x86_64-unknown-linux-gnu.tar.gz | cut -d ' ' -f 1)" \
            "$(sha256sum dist/websudo-aarch64-unknown-linux-gnu.tar.gz | cut -d ' ' -f 1)" \
            dist/aur/PKGBUILD
      - name: Rehearse AUR package layout
        run: |
          set -euo pipefail
          mkdir -p dist/aur/src
          tar -xzf dist/websudo-x86_64-unknown-linux-gnu.tar.gz -C dist/aur/src
          tar -xzf dist/websudo-aarch64-unknown-linux-gnu.tar.gz -C dist/aur/src
          for arch in x86_64 aarch64; do
            pkgdir="$PWD/dist/aur/pkg-$arch"
            srcdir="$PWD/dist/aur/src"
            mkdir -p "$pkgdir"
            CARCH="$arch" pkgdir="$pkgdir" srcdir="$srcdir" bash -c 'source dist/aur/PKGBUILD; package'
            test -x "$pkgdir/usr/bin/websudo"
            test -x "$pkgdir/usr/bin/websudo-askpass"
            test -x "$pkgdir/usr/bin/websudo-approverd"
            test -f "$pkgdir/usr/lib/systemd/user/websudo-approverd.service"
            test -f "$pkgdir/etc/websudo/websudo.env.example"
            test -f "$pkgdir/usr/share/websudo/README.md"
            test -f "$pkgdir/usr/share/licenses/websudo-bin/LICENSE"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, lint, test, build, linux-artifacts, aur-rehearsal]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: linux-*-artifacts
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  aur:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'rijuyuezhu/websudo'
    needs: release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: linux-*-artifacts
          path: dist
          merge-multiple: true
      - name: Generate AUR PKGBUILD
        run: |
          mkdir -p dist/aur
          cp packaging/aur/websudo-bin.install dist/aur/websudo-bin.install
          packaging/scripts/render-aur-pkgbuild.sh \
            "${GITHUB_REF_NAME#v}" \
            "$(sha256sum dist/websudo-x86_64-unknown-linux-gnu.tar.gz | cut -d ' ' -f 1)" \
            "$(sha256sum dist/websudo-aarch64-unknown-linux-gnu.tar.gz | cut -d ' ' -f 1)" \
            dist/aur/PKGBUILD
      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: websudo-bin
          pkgbuild: dist/aur/PKGBUILD
          assets: |
            dist/aur/websudo-bin.install
          test: true
          test_flags: --clean --cleanbuild --nodeps --noconfirm
          post_process: rm -f websudo-*.tar.gz websudo-bin-*.pkg.tar.*
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update websudo-bin to ${{ github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
